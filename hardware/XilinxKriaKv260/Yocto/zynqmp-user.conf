#### Preamble
MACHINEOVERRIDES =. "${@['', 'k26-smk-kv:']['k26-smk-kv' != '${MACHINE}']}"
MACHINEOVERRIDES =. "k26-kv:"
#### Regular settings follow

require conf/machine/include/k26-smk.inc
require conf/machine/include/kria-qemu-kv.inc

# rel-v2026.1: meta-kria's k26-smk.inc dropped the YAML_DT_BOARD_FLAGS line it carried in
# rel-v2025.1. That flag is what makes xsctyaml.bbclass emit periph_type_overrides, which
# pulls the SMK-K26 board DTSI (zynqmp-smk-k26-reva.dtsi) into the generated system-top.dtb
# -> the U-Boot control DTB (and BOOT.BIN). Without it, U-Boot embeds a generic "xlnx,zynqmp"
# tree with no SOM compatible string and no FRU EEPROM nodes (eeprom@50/@51 + bootph-all), so
# U-Boot no longer detects the K26 SOM or reads its EEPROM MAC, and the kernel falls back to a
# random MAC instead of the 00:0A:35 Xilinx OUI. Restore the flag here (every sibling
# axi-soc-ultra-plus-core ZCU board sets its own YAML_DT_BOARD_FLAGS the same way).
YAML_DT_BOARD_FLAGS ?= "{BOARD zynqmp-smk-k26-reva}"

# rel-v2026.1: meta-kria's k26-smk.inc adds 'kria-qspi' to EXTRA_IMAGEDEPENDS, but
# kria-qspi's COMPATIBLE_MACHINE only allows the *-sdt-multidomain machines, not our
# custom 'zynqmp-user'. This project builds its own boot.bin/image.ub (not the Kria
# SOM A/B/recovery QSPI image), so drop the dependency. Mirrors upstream's own
# removal in xilinx-bootbin.bbappend.
EXTRA_IMAGEDEPENDS:remove = "kria-qspi"

# rel-v2026.1: meta-kria's kria-common.inc unconditionally adds "wic wic.xz
# wic.qemu-sd" to IMAGE_FSTYPES. Because we set INITRAMFS_IMAGE below, the kernel
# bundles petalinux-image-minimal as its initramfs (do_bundle_initramfs ->
# <image>:do_image_complete), while do_image_wic[recrdeptask] pulls linux-xlnx:
# do_deploy -> do_bundle_initramfs -> back to do_image_complete: a build-aborting
# dependency loop. PetaLinux's own distro conf drops "wic" exactly when
# INITRAMFS_IMAGE is set to avoid this; kria-common.inc defeats that guard. This
# project boots from boot.bin + a hand-built image.ub (FIT) and never consumes the
# wic, so drop the wic fstypes for our machine to break the loop.
IMAGE_FSTYPES:remove = "wic wic.xz wic.qemu-sd"

INITRAMFS_IMAGE ?= "petalinux-image-minimal"

UBOOT_DT_FILES = "\
    zynqmp-sck-kv-g-revA.dtso \
    zynqmp-sck-kv-g-revB.dtso \
    "

# DTB_FILE_NAME cant be changed globally or it will break the build but we can modify it for these
# tasks specifically so that the resulting symlink points to the correct file for a specific board
DTB_FILE_NAME:task-install:pn-device-tree = "${UBOOT_DTFILE_PREFIX}-zynqmp-sck-kv-g-revB.dtb"
DTB_FILE_NAME:task-deploy:pn-device-tree = "${UBOOT_DTFILE_PREFIX}-zynqmp-sck-kv-g-revB.dtb"
# Workaround for bitbake not detecting the above change in the hash
PR:append:pn-device-tree = ".1"

# rel-v2026.1: meta-kria selects boot.cmd.kria for k26-smk machines, which hardcodes
# bootargs and (unlike the generic boot.scr every other axi-soc-ultra-plus-core platform
# uses) does NOT append the device-tree /chosen bootargs. That silently drops net.ifnames=0
# (eth0 -> end0, breaks DHCP), clk_ignore_unused (kernel gates the UART clock -> serial RX
# dies) and cma=1024M (-> 256M). Restore them via KERNEL_COMMAND_APPEND, the only bootarg
# knob boot.cmd.kria honors (weak-default "root=LABEL=root" in kria-common.inc).
KERNEL_COMMAND_APPEND = "net.ifnames=0 biosdevname=0 clk_ignore_unused cma=1024M root=LABEL=root"

#### No additional settings should be after the Postamble
#### Postamble
PACKAGE_EXTRA_ARCHS:append = "${@['', ' k26_smk_kv']['k26-smk-kv' != "${MACHINE}"]}"

