BBPATH .= ":${LAYERDIR}"

# Deliberately narrow: only .bbappend files under recipes-bsp/. Does NOT glob recipes-apps/*.bb
# (those stay reachable exclusively via the pre-existing meta-user symlink — no duplication).
BBFILES += "${LAYERDIR}/recipes-bsp/*/*.bbappend"

BBFILE_COLLECTIONS += "netboot-hooks"
BBFILE_PATTERN_netboot-hooks = "^${LAYERDIR}/"
BBFILE_PRIORITY_netboot-hooks = "10"
LAYERSERIES_COMPAT_netboot-hooks = "scarthgap"

LAYERDEPENDS_netboot-hooks = "xilinx"
