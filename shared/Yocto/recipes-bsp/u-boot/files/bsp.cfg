CONFIG_SYS_CONFIG_NAME="platform-top"

# Enable the I2C EEPROM / NVMEM drivers so U-Boot can read the board MAC from the
# on-board I2C PROM. Kconfig-fragment syntax (CONFIG_x=y) is required here; the older
# per-board "#define CONFIG_x y" form was a comment and never took effect. The per-board
# EEPROM bus/address is provided by the device tree, not by this fragment.
CONFIG_NVMEM=y
CONFIG_I2C_EEPROM=y

# No fragment needed for the PXE netboot hook ('pxe get' / 'pxe boot' in
# platform-top.h): CONFIG_CMD_PXE, CONFIG_PXE_UTILS, and CONFIG_MENU are already
# enabled by the ZynqMP defconfig (via CONFIG_DISTRO_DEFAULTS), and 'bootcmd_pxe'
# is present in the built default environment. Verified against the u-boot-xlnx
# 2026.01 (xilinx-v2026.1) .config; do not re-add these here.

# Required by the tftp-only netboot bitstream step ('fpga load' in the
# loadpl_net env of platform-top.h, which fetches system.bit.bin over TFTP and
# programs the PL via PCAP before booting the kernel FIT). These are normally
# already on in the ZynqMP defconfig, but this feature hard-depends on them, so
# pin them explicitly rather than rely on the defconfig staying that way.
CONFIG_FPGA=y
CONFIG_FPGA_XILINX=y
CONFIG_FPGA_ZYNQMPPL=y
CONFIG_CMD_FPGA=y
